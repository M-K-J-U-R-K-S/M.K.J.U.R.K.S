<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My reviews · Pump Check</title>
  <link rel="stylesheet" href="css/styles.css?v=blue-white-3">
  <link rel="icon" type="image/png" href="assets/favicon.png">
</head>
<body>
  <header id="navbar"></header>

  <main id="main" class="container stack">
    <h1>My reviews</h1>

    <div id="message" class="alert" hidden></div>

    <p id="review-count" class="muted" aria-live="polite"></p>
    <p id="empty" class="muted" hidden>
      You have not reviewed any gyms yet. <a href="gyms.html">Find a gym</a> and share your experience.
    </p>
    <div id="reviews" class="stack"></div>
    <button id="load-more" class="btn btn-secondary" type="button" hidden>Load more reviews</button>
  </main>

  <script type="module" src="js/my-reviews.js?v=account-1"></script>
</body>
</html>
